<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1400" viewBox="0 0 1600 1400">
  <style>.title{font:400 62px Georgia,serif;letter-spacing:-3px}.intro{font:400 18px Arial,sans-serif}.label{font:700 12px Arial,sans-serif;letter-spacing:2px}.note{font:400 15px Arial,sans-serif}.rule{font:700 12px Arial,sans-serif;letter-spacing:2px}.copy{font:400 15px Arial,sans-serif}</style>
  <rect width="1600" height="1400" fill="#f3f0e8"/>
  <text x="70" y="84" class="title" fill="#111612">One network. One visual language.</text>
  <text x="70" y="122" class="intro" fill="#667068">A connected identity for the MIXX platform, products and live formats. MIXX TANK and SWAY IRL remain unchanged.</text>

  <g transform="translate(70 170)"><rect width="710" height="245" rx="22" fill="#fff" stroke="#d7d1c5"/><text x="28" y="35" class="label" fill="#6c736d">01 / PARENT — MIXX GROUP</text><image x="35" y="50" width="640" height="165" xlink:href="logos/mixx-group.svg"/></g>
  <g transform="translate(820 170)"><rect width="710" height="245" rx="22" fill="#fff" stroke="#d7d1c5"/><text x="28" y="35" class="label" fill="#6c736d">02 / PLATFORM — MIXXWAVE</text><image x="35" y="50" width="640" height="165" xlink:href="logos/mixxwave.svg"/></g>
  <g transform="translate(70 435)"><rect width="710" height="245" rx="22" fill="#fff" stroke="#d7d1c5"/><text x="28" y="35" class="label" fill="#6c736d">03 / CONSUMER — MIXXPLAY</text><image x="35" y="50" width="640" height="165" xlink:href="logos/mixxplay.svg"/></g>
  <g transform="translate(820 435)"><rect width="710" height="245" rx="22" fill="#fff" stroke="#d7d1c5"/><text x="28" y="35" class="label" fill="#6c736d">04 / VENUE PLAYER — MIXXBOX</text><image x="35" y="50" width="640" height="165" xlink:href="logos/mixxbox.svg"/></g>
  <g transform="translate(70 700)"><rect width="710" height="245" rx="22" fill="#fff" stroke="#d7d1c5"/><text x="28" y="35" class="label" fill="#6c736d">05 / ATMOSPHERE — MIXXVIBE</text><image x="35" y="50" width="640" height="165" xlink:href="logos/mixxvibe.svg"/></g>
  <g transform="translate(820 700)"><rect width="710" height="245" rx="22" fill="#fff" stroke="#d7d1c5"/><text x="28" y="35" class="label" fill="#6c736d">06 / LIVE FRANCHISE — BOURBON GAMES</text><image x="35" y="50" width="640" height="165" xlink:href="logos/bourbon-games.svg"/></g>
  <g transform="translate(70 965)"><rect width="1460" height="245" rx="22" fill="#201a16"/><text x="28" y="35" class="label" fill="#b9aa99">07 / FIRST FORMAT — WHISKEY DRAFT</text><rect x="420" y="47" width="620" height="165" rx="12" fill="#f3f0e8"/><image x="430" y="47" width="600" height="165" xlink:href="logos/whiskey-draft.svg"/></g>

  <g transform="translate(70 1255)"><path d="M0 0h345M375 0h345M750 0h345M1125 0h335" stroke="#111612" stroke-width="3"/><text y="30" class="rule">THE CONSTANT</text><text y="55" class="copy" fill="#667068">MIXX stays bold and unmistakable.</text><text x="375" y="30" class="rule">THE SIGNAL</text><text x="375" y="55" class="copy" fill="#667068">Every mark has a functional symbol.</text><text x="750" y="30" class="rule">THE COLOR</text><text x="750" y="55" class="copy" fill="#667068">Color identifies each experience.</text><text x="1125" y="30" class="rule">THE EXCEPTIONS</text><text x="1125" y="55" class="copy" fill="#667068">Keep MIXX TANK and SWAY IRL.</text></g>
</svg>
