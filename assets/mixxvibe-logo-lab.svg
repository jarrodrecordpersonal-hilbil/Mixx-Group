<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <defs>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff633f"/><stop offset=".32" stop-color="#ffcf5c"/><stop offset=".62" stop-color="#765dff"/><stop offset="1" stop-color="#45dcff"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6754ff"/><stop offset="1" stop-color="#49dfff"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.title{font:800 28px Arial,sans-serif;letter-spacing:-1px}.label{font:700 12px Arial,sans-serif;letter-spacing:2px}.note{font:400 15px Arial,sans-serif}.word{font:900 64px Arial,sans-serif;letter-spacing:-5px}.sub{font:600 12px Arial,sans-serif;letter-spacing:4px}</style>
  </defs>
  <rect width="1600" height="1120" fill="#f3f0e8"/>
  <text x="70" y="70" class="title" fill="#111612">MIXXVIBE — IDENTITY DIRECTIONS</text>
  <text x="70" y="102" class="note" fill="#667068">Alive, atmospheric and connected to the MIXX family. Six routes—not six finished logos.</text>

  <g transform="translate(70 150)">
    <rect width="710" height="270" rx="24" fill="#fff" stroke="#d9d5ca"/>
    <text x="28" y="35" class="label" fill="#747b75">01 / THE PULSE — RECOMMENDED</text>
    <g transform="translate(55 82)">
      <text x="0" y="75" class="word" fill="#111612">MIXX</text>
      <text x="172" y="75" class="word" fill="#111612">VIBE</text>
      <path d="M0 112 H150 L165 91 L181 128 L198 105 H280 L294 82 L311 133 L329 112 H540" fill="none" stroke="url(#spectrum)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="540" cy="112" r="7" fill="#45dcff"/>
      <text x="2" y="152" class="sub" fill="#69716b">THE ROOM, IN RHYTHM.</text>
    </g>
  </g>

  <g transform="translate(820 150)">
    <rect width="710" height="270" rx="24" fill="#17152d"/>
    <text x="28" y="35" class="label" fill="#9692bd">02 / THE SIGNAL</text>
    <g transform="translate(48 78)">
      <path d="M30 18 L78 112 L126 18" fill="none" stroke="url(#violet)" stroke-width="15" stroke-linecap="round"/>
      <path d="M12 25 Q-12 65 12 105 M145 25 Q169 65 145 105" fill="none" stroke="#45dcff" stroke-width="5" stroke-linecap="round" opacity=".8"/>
      <text x="180" y="91" class="word" fill="#f6f2e8">MIXX</text><text x="352" y="91" class="word" fill="#7ae8ff">VIBE</text>
      <text x="183" y="132" class="sub" fill="#aaa7c5">BROADCAST THE FEELING.</text>
    </g>
  </g>

  <g transform="translate(70 450)">
    <rect width="710" height="270" rx="24" fill="#272166"/>
    <text x="28" y="35" class="label" fill="#aca5ec">03 / THE FREQUENCY</text>
    <g transform="translate(55 83)">
      <text x="0" y="73" class="word" fill="#fff">MIXX</text><text x="173" y="73" class="word" fill="#aef4ff">VIBE</text>
      <g transform="translate(6 101)" fill="url(#spectrum)"><rect width="16" height="18" rx="8"/><rect x="27" y="-10" width="16" height="28" rx="8"/><rect x="54" y="-28" width="16" height="46" rx="8"/><rect x="81" y="-5" width="16" height="23" rx="8"/><rect x="108" y="-39" width="16" height="57" rx="8"/><rect x="135" y="-18" width="16" height="36" rx="8"/><rect x="162" y="-3" width="16" height="21" rx="8"/></g>
      <text x="215" y="117" class="sub" fill="#c2bfee">PROGRAMMING WITH A PULSE.</text>
    </g>
  </g>

  <g transform="translate(820 450)">
    <rect width="710" height="270" rx="24" fill="#e7e0d3"/>
    <text x="28" y="35" class="label" fill="#777167">04 / THE ORBIT</text>
    <g transform="translate(40 72)">
      <circle cx="76" cy="78" r="57" fill="none" stroke="#111612" stroke-width="5"/>
      <path d="M38 45 L76 112 L114 45" fill="none" stroke="#111612" stroke-width="12" stroke-linecap="round"/>
      <circle cx="127" cy="50" r="10" fill="#ff633f"/>
      <path d="M21 89 A58 58 0 0 1 120 35" fill="none" stroke="url(#spectrum)" stroke-width="4" stroke-linecap="round"/>
      <text x="165" y="93" class="word" fill="#111612">MIXXVIBE</text>
      <text x="169" y="132" class="sub" fill="#6f6b64">ENERGY THAT FITS THE ROOM.</text>
    </g>
  </g>

  <g transform="translate(70 750)">
    <rect width="710" height="270" rx="24" fill="#073c2c"/>
    <text x="28" y="35" class="label" fill="#82aa9b">05 / THE NEON BAND</text>
    <g transform="translate(50 73)">
      <rect x="0" y="0" width="610" height="112" rx="56" fill="none" stroke="url(#spectrum)" stroke-width="6" filter="url(#glow)"/>
      <text x="52" y="75" class="word" fill="#f5f0e5">MIXX</text><text x="224" y="75" class="word" fill="#cbff7d">VIBE</text>
      <circle cx="556" cy="55" r="10" fill="#45dcff" filter="url(#glow)"/>
      <text x="130" y="152" class="sub" fill="#a9c7bb">SET THE ROOM IN MOTION.</text>
    </g>
  </g>

  <g transform="translate(820 750)">
    <rect width="710" height="270" rx="24" fill="#fff" stroke="#d9d5ca"/>
    <text x="28" y="35" class="label" fill="#747b75">06 / THE BUG</text>
    <g transform="translate(42 72)">
      <rect width="142" height="142" rx="34" fill="#111612"/>
      <path d="M27 38 L70 111 L113 38" fill="none" stroke="url(#violet)" stroke-width="17" stroke-linecap="round"/>
      <path d="M28 118 H55 L64 103 L74 127 L84 111 H114" fill="none" stroke="#cbff7d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="175" y="84" class="word" fill="#111612">MIXXVIBE</text>
      <text x="179" y="126" class="sub" fill="#69716b">A COMPACT APP + SCREEN MARK.</text>
    </g>
  </g>

  <text x="70" y="1080" class="note" fill="#667068">Recommendation: build the final system from Route 01, with Route 06 as its compact TV/app bug.</text>
</svg>
