name: MIXX Group site checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Render publish directory with verified original artwork
        run: sh build.sh
      - name: Verify public routes, metadata and internal links
        run: node scripts/verify-site.mjs
      - name: Verify generated publish output
        run: |
          test -f public/index.html
          test -f public/robots.txt
          test -f public/sitemap.xml
          for route in shows community mixx-tank mixx-wave mixx-bench mixx-measure sway partners about sunday-pours bourbon-games-live mixxvibe mixxbox mixxplay maison-cedro barrel-run benchpacking; do
            test -f "public/$route/index.html"
          done
          test -s public/assets/logos/sway-irl.png
      - name: Retain exact build for visual review
        uses: actions/upload-artifact@v4
        with:
          name: mixx-group-verified-site
          path: public/
          retention-days: 3
          if-no-files-found: error
